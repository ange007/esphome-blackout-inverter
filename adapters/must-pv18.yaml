  - platform: modbus_controller
    modbus_controller_id: must
    address: 25251
    id: sell_mwh
    register_type: holding
    internal: true


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25252
    id: sell_kwh
    register_type: holding
    internal: true
    filters:
      - multiply: 0.1


  - platform: template
