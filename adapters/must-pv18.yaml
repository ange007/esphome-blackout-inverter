    accuracy_decimals: 1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25259
    id: grid_charge_mwh
    register_type: holding
    internal: true


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25260
    id: grid_charge_kwh
    register_type: holding
    internal: true
    filters:
      - multiply: 0.1


  - platform: template
    name: "Accumulated Grid Charge Power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    entity_category: diagnostic
    lambda: |-
      return (id(grid_charge_mwh).state * 1000.0 + id(grid_charge_kwh).state);
    accuracy_decimals: 1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25273
    id: battery_power
    name: "Battery power"
    # Charger-side reg — unreliable for battery accounting (see net sensors). Diagnostic only.
    disabled_by_default: true
    unit_of_measurement: "W"
    device_class: power
    register_type: holding
    value_type: S_WORD
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25274
    id: battery_current
    name: "Battery current"
    # Charger-side reg — unreliable for battery accounting. Diagnostic only.
    disabled_by_default: true
    unit_of_measurement: "A"
    device_class: current
    register_type: holding
    value_type: S_WORD
    accuracy_decimals: 1
    state_class: measurement

  # Contract readings (bi_*). Fixed ids for the core; each mirrors one MUST
  # entity (or a trivial derived quantity) and holds NAN while unavailable.
  # Internal + 60 s (Task 7b RAM): core reads id().state locally, so HA
  # publishing is pure overhead; 60 s halved the polling rate. bi_data_ms
  # (the staleness clock) is driven by on_value above, not by these.
  - platform: template
    id: bi_soc
    internal: true
    name: "BI SoC"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      float v = id(battery_state_of_charge).state;
      if (isnan(v)) return NAN;
      return v;

  - platform: template
    id: bi_battery_voltage
    internal: true
    name: "BI Battery voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 2
    lambda: |-
      float v = id(battery_voltage_sensor).state;
      if (isnan(v)) return NAN;
      return v;

  - platform: template
    id: bi_battery_power
    internal: true
    name: "BI Battery power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      float v = id(battery_power).state;
      if (isnan(v)) return NAN;
      return v;

  - platform: template
    id: bi_grid_voltage
    internal: true
    name: "BI Grid voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 1
    lambda: |-
      float v = id(grid_voltage_sensor).state;
      if (isnan(v)) return NAN;
      return v;

  - platform: template
