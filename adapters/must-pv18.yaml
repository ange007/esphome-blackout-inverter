    modbus_controller_id: must
    address: 44180
    id: battery_state_of_charge
    name: "Battery State of Charge"
    register_type: holding
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    value_type: U_WORD
    on_value:
      - lambda: 'id(last_soc_update_ms) = millis(); id(bi_data_ms) = millis();'


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15202
    name: "MPPT State"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15203
    name: "Charging State"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25261
    name: "Inverter Error 1"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25262
    name: "Inverter Error 2"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25263
    name: "Inverter Error 3"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
