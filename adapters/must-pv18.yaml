# MUST PV18 adapter — extracted inverter-specific parts.
# UART, Modbus controller, and all Modbus entities.

# The contract surface (bi_* scripts, reconcile, read-back sensors) is shared by the
# Voltronic-family adapters; this file only declares the entities it drives.
packages:
  sync: !include
    file: common/voltronic-sync.yaml
    vars:
      adapter_name: "MUST PV18"
      cap_solar_aim: "1"
      cap_grid_only: "1"
      stop_by_soc: "0"
      writes_enabled: "1"   # tested on a live unit

uart:
  id: mod_bus
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}
  baud_rate: 19200
  stop_bits: 1
  parity: NONE
  data_bits: 8


modbus:
  id: mod_bus_must
  send_wait_time: 350ms
  flow_control_pin: ${flow_control_pin}


modbus_controller:
  - id: must
    address: 0x4
    modbus_id: mod_bus_must
    setup_priority: -10
    update_interval: ${updates}


number:
  - platform: modbus_controller
    modbus_controller_id: must
    id: grid_charger_amps
    name: "Max Grid Charger current"
    unit_of_measurement: "A"
    address: 20125
    value_type: U_WORD
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"
    entity_category: config


  - platform: modbus_controller
    modbus_controller_id: must
    id: batt_float_voltage
    name: "Float voltage"
    unit_of_measurement: "V"
    entity_category: config
    address: 10103
    value_type: U_WORD
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"


  - platform: modbus_controller
    modbus_controller_id: must
    id: batt_absorb_voltage
    name: "Absorb voltage"
    unit_of_measurement: "V"
    entity_category: config
    address: 10104
    value_type: U_WORD
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"


  - platform: modbus_controller
    modbus_controller_id: must
    name: "Max Combine Charger current"
    unit_of_measurement: "A"
    entity_category: config
    address: 20132
    value_type: U_WORD
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"

  # ============ BMS PROTECTION PARAMETERS ============

  - platform: modbus_controller
    modbus_controller_id: must
    id: batt_stop_dischg
    name: "Battery stop discharging voltage"
    unit_of_measurement: "V"
    entity_category: config
    address: 20118
    value_type: U_WORD
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"


  - platform: modbus_controller
    modbus_controller_id: must
    id: batt_stop_chg
    name: "Battery stop charging voltage"
    unit_of_measurement: "V"
    entity_category: config
    address: 20119
    value_type: U_WORD
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"


  - platform: modbus_controller
    modbus_controller_id: must
    id: batt_low_voltage
    name: "Battery low voltage"
    unit_of_measurement: "V"
    entity_category: config
    address: 20127
    value_type: U_WORD
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"


  - platform: modbus_controller
    modbus_controller_id: must
    id: batt_high_voltage
    name: "Battery high voltage"
    unit_of_measurement: "V"
    entity_category: config
    address: 20128
    value_type: U_WORD
    lambda: "return x * 0.1;"
    write_lambda: "return x * 10;"



select:
  - platform: modbus_controller
    modbus_controller_id: must
    id: energy_use_mode
    name: "Energy use mode (parameter 00)"
    address: 20109
    entity_category: config
    optionsmap:
      "SBU (Solar/battery/utility)": 1
      "SUB (Solar/utility/battery)": 2
      "UTI (Utility only)": 3
      "SOL (Solar only)": 4


  - platform: modbus_controller
    modbus_controller_id: must
    id: charger_source_priority
    name: "Charger source priority (parameter 10)"
    address: 20143
    entity_category: config
    optionsmap:
      "CSO (Solar first)": 0
      "SNU (Solar and utility)": 2
      "OSO (Solar only)": 3


  - platform: modbus_controller
    modbus_controller_id: must
    id: solar_use_aim
    name: "Solar Use Aim"
    address: 20112
    entity_category: config
    optionsmap:
      "LBU (Load, Battery, Utility)": 0
      "BLU (Battery, Load, Utility)": 1

  # ============ ENERGY STRATEGY ============
  # Replaces the old "Winter Mode" and "Battery Preserve Mode" switches. All three
  # options run the same reserve logic; they differ in how much autonomy the reserve
  # has to cover and how eagerly the grid is used to rebuild it.
  #
  #   Sun     ${reserve_hours_sun}h of autonomy. Solar covers the day, the battery is a
  #           night buffer. The grid is essentially never used to charge.
  #   Reserve ${reserve_hours_reserve}h of autonomy — one rolling-blackout block. The
  #           battery works freely above the reserve; the grid only refills it.
  #   Backup  Battery held at ${backup_target_soc}% and not discharged, grid carries the
  #           house. UPS behaviour for unscheduled outages.


text_sensor:
  - platform: modbus_controller
    modbus_controller_id: must
    address: 15201
    name: "Charger Workstate"
    icon: mdi:battery-charging-50
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t value = modbus::helpers::word_from_hex_str(x, 0);
      switch (value) {
        case 0: return std::string("Init");
        case 1: return std::string("Test");
        case 2: return std::string("Work");
        case 3: return std::string("Stop");
        default: return std::string("Unknown");
      }
      return x;

  # Charger Error (reg 15213) decoded per MUST protocol 1.4.15 "PV Charger Alarm".
  # Bit5 = "PV voltage too low" — the normal night state (no sun), reported as benign.

  - platform: modbus_controller
    modbus_controller_id: must
    address: 15213
    name: "Charger Error (decoded)"
    icon: "mdi:alert-circle-outline"
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t v = modbus::helpers::word_from_hex_str(x, 0);
      const char* bits[10] = {
        "Hardware protection", "Over current", "Current sensor error",
        "Over temperature", "PV voltage too high", "PV voltage too low",
        "Battery voltage too high", "Battery voltage too low",
        "Current uncontrollable", "Parameter error"
      };
      // bit5 (PV voltage too low) is benign at night — collect real faults separately
      std::string faults = "";
      bool pv_low = (v & (1 << 5));
      for (int i = 0; i < 10; i++) {
        if (i == 5) continue;
        if (v & (1 << i)) {
          if (!faults.empty()) faults += ", ";
          faults += bits[i];
        }
      }
      if (!faults.empty()) return faults;
      if (pv_low) return std::string("OK (no PV input)");
      return std::string("OK");

  # Charger Warning (reg 15214): only bit0 is defined (Fan Error), rest reserved.

  - platform: modbus_controller
    modbus_controller_id: must
    address: 15214
    name: "Charger Warning (decoded)"
    disabled_by_default: true
    icon: "mdi:alert-outline"
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t v = modbus::helpers::word_from_hex_str(x, 0);
      if (v & (1 << 0)) return std::string("Fan Error");
      return std::string("OK");

  # Inverter Error message 1 (reg 25261) decoded per MUST protocol 1.4.15 "Inverter Alarm".

  - platform: modbus_controller
    modbus_controller_id: must
    address: 25261
    name: "Inverter Error 1 (decoded)"
    disabled_by_default: true
    icon: "mdi:alert-circle-outline"
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t v = modbus::helpers::word_from_hex_str(x, 0);
      const char* bits[16] = {
        "Fan locked (inverter off)", "Transformer over temperature",
        "Battery voltage too high", "Battery voltage too low",
        "Output short circuited", "Output voltage high", "Overload time out",
        "Bus voltage too high", "Bus soft start failed", "Main relay failed",
        "Output voltage sensor error", "Grid voltage sensor error",
        "Output current sensor error", "Grid current sensor error",
        "Load current sensor error", "Grid over current error"
      };
      std::string s = "";
      for (int i = 0; i < 16; i++) if (v & (1 << i)) { if (!s.empty()) s += ", "; s += bits[i]; }
      return s.empty() ? std::string("OK") : s;

  # Inverter Error message 2 (reg 25262) decoded per MUST protocol 1.4.15 "Inverter Alarm".

  - platform: modbus_controller
    modbus_controller_id: must
    address: 25262
    name: "Inverter Error 2 (decoded)"
    disabled_by_default: true
    icon: "mdi:alert-circle-outline"
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t v = modbus::helpers::word_from_hex_str(x, 0);
      const char* bits[16] = {
        "Radiator over temperature", "Solar charger battery voltage class error",
        "Solar charger current sensor error", "Solar charger current uncontrollable",
        "Grid voltage low", "Grid voltage high", "Grid under frequency",
        "Grid over frequency", "Over current protection error", "Bus voltage too low",
        "Soft start failed", "Over DC voltage in AC output", "Battery connection open",
        "Control current sensor error", "Output voltage too low", "reserved"
      };
      std::string s = "";
      for (int i = 0; i < 16; i++) if (v & (1 << i)) { if (!s.empty()) s += ", "; s += bits[i]; }
      return s.empty() ? std::string("OK") : s;

  # Inverter Warning message 1 (reg 25265) decoded per MUST protocol 1.4.15 "Inverter Alarm".

  - platform: modbus_controller
    modbus_controller_id: must
    address: 25265
    name: "Inverter Warning 1 (decoded)"
    disabled_by_default: true
    icon: "mdi:alert-outline"
    register_type: holding
    raw_encode: HEXBYTES
    lambda: |-
      uint16_t v = modbus::helpers::word_from_hex_str(x, 0);
      const char* bits[11] = {
        "Fan locked (inverter on)", "Fan2 locked (inverter on)",
        "Battery over-charged", "Low battery", "Overload",
        "Output power derating", "Solar charger stopped: low battery",
        "Solar charger stopped: high PV voltage", "Solar charger stopped: over load",
        "Solar charger over temperature", "PV charger communication error"
      };
      std::string s = "";
      for (int i = 0; i < 11; i++) if (v & (1 << i)) { if (!s.empty()) s += ", "; s += bits[i]; }
      return s.empty() ? std::string("OK") : s;

  # Learned average load per hour-of-day, "00:W,01:W,...". Disabled by default — it is
  # a diagnostic, but a useful one: it shows which hours an outage would actually cost
  # the most, which is exactly what sizes the reserve.


sensor:
