  - platform: template
    id: bi_charger_state
    internal: true
    name: "BI Charger state"
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      float i = id(battery_current).state;
      float v = id(battery_voltage_sensor).state;
      float stop = id(batt_stop_chg).state;
      if (isnan(i) || isnan(v)) return NAN;
      if (!isnan(stop) && v >= stop - 0.2f && i < 2.0f) return 2.0f;
      return i > 0.5f ? 1.0f : 0.0f;
