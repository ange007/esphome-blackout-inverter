    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25266
    name: "Inverter Warning 2"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15213
    bitmask: 0x3ff
    name: "Charger Error"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15214
    name: "Charger Warning"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15206
    name: "Battery Voltage (charger)"
    unit_of_measurement: "V"
    device_class: voltage
    register_type: holding
    accuracy_decimals: 1
    state_class: measurement
    filters:
      - multiply: 0.1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15205
    name: "PV1 Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    register_type: holding
    accuracy_decimals: 1
    state_class: measurement
    filters:
      - multiply: 0.1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15207
    name: "PV1 Current"
    disabled_by_default: true
    unit_of_measurement: "A"
    device_class: current
    register_type: holding
    accuracy_decimals: 1
    state_class: measurement
    filters:
      - multiply: 0.1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15208
    id: pv1_power_sensor
    name: "PV1 Power"
    unit_of_measurement: "W"
    device_class: power
    register_type: holding
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15211
    name: "Battery Relay"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15217
    id: charger_total_mwh
    register_type: holding
    internal: true


  - platform: modbus_controller
    modbus_controller_id: must
    address: 15218
    id: charger_total_kwh
    register_type: holding
    internal: true
    filters:
      - multiply: 0.1


  - platform: template
    name: "Accumulated Solar Power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    entity_category: diagnostic
    lambda: |-
      return (id(charger_total_mwh).state * 1000.0 + id(charger_total_kwh).state);
    accuracy_decimals: 1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25201
    name: "Inverter Work State"
    register_type: holding
    entity_category: diagnostic


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25205
    id: battery_voltage_sensor
    name: "Battery voltage"
    unit_of_measurement: "V"
    device_class: voltage
    register_type: holding
    accuracy_decimals: 2
    state_class: measurement
    filters:
      - multiply: 0.1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25206
    name: "Inverter voltage"
    unit_of_measurement: "V"
    device_class: voltage
    register_type: holding
    accuracy_decimals: 1
    state_class: measurement
    filters:
      - multiply: 0.1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25207
    id: grid_voltage_sensor
    name: "Grid voltage"
    unit_of_measurement: "V"
    device_class: voltage
    register_type: holding
    accuracy_decimals: 1
    state_class: measurement
    filters:
      - multiply: 0.1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25213
    id: inverter_power_sensor
    # Apparent power (VA), not real power: measured 561 against 2.45 A x 228 V = 558 VA
    # on a sub-circuit meter reading 501 W at the same moment. Fine for the load figure
    # below, where it is differenced against grid_power, but do not treat it as watts
    # when calibrating efficiency.
    name: "Inverter power"
    unit_of_measurement: "W"
    device_class: power
    register_type: holding
    value_type: S_WORD
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25214
    id: grid_power_sensor
    name: "Grid power"
    unit_of_measurement: "W"
    device_class: power
    register_type: holding
    value_type: S_WORD
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25215
    id: load_power_sensor
    # Direct load measurement, read on the device as a last-resort floor for
    # [EH] Load Power. It under-reads a little, but it survives bypass — before the
    # grid_power sign was fixed it was the only register still reporting the real load
    # there. Hidden in HA because [EH] Load Power is the one to watch; the lambda reads
    # it regardless of whether the entity is enabled.
    name: "Load power"
    disabled_by_default: true
    unit_of_measurement: "W"
    device_class: power
    register_type: holding
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25216
    name: "System load"
    unit_of_measurement: "%"
    register_type: holding
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25233
    name: "AC radiator temp"
    unit_of_measurement: "°C"
    device_class: temperature
    register_type: holding
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25234
    name: "Transformer temp"
    unit_of_measurement: "°C"
    device_class: temperature
    register_type: holding
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25235
    name: "DC Radiator temp"
    unit_of_measurement: "°C"
    device_class: temperature
    register_type: holding
    accuracy_decimals: 0
    state_class: measurement


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25247
    id: discharger_total_mwh
    register_type: holding
    internal: true


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25248
    id: discharger_total_kwh
    register_type: holding
    internal: true
    filters:
      - multiply: 0.1


  - platform: template
    name: "Accumulated Discharger Power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    entity_category: diagnostic
    lambda: |-
      return (id(discharger_total_mwh).state * 1000.0 + id(discharger_total_kwh).state);
    accuracy_decimals: 1


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25249
    id: buy_mwh
    register_type: holding
    internal: true


  - platform: modbus_controller
    modbus_controller_id: must
    address: 25250
    id: buy_kwh
    register_type: holding
    internal: true
    filters:
      - multiply: 0.1


  - platform: template
    name: "Accumulated Buy Power"
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
