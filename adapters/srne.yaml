  - platform: template
    id: bi_pv_power
    internal: true
    name: "BI PV power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      float v1 = id(pv1_power_sensor).state;
      float v2 = id(pv2_power_sensor).state;
      if (isnan(v1) && isnan(v2)) return NAN;
      if (isnan(v1)) v1 = 0.0f;
      if (isnan(v2)) v2 = 0.0f;
      return v1 + v2;

  - platform: template
    id: bi_grid_power
    internal: true
    name: "BI Grid power"
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      // Import-positive: mains-charge-current x grid-V, clamped at 0.
      float v = id(grid_voltage_sensor).state;
      float i = id(mains_charge_current).state;
      if (isnan(v) || isnan(i)) return NAN;
      float p = v * i;
      return p < 0.0f ? 0.0f : p;

  - platform: template
    id: bi_battery_current
    internal: true
    name: "BI Battery current"
    unit_of_measurement: "A"
    device_class: current
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 1
    lambda: |-
      float v = id(battery_current).state;
      if (isnan(v)) return NAN;
      return v;

  - platform: template
    id: bi_grid_present
    internal: true
    name: "BI Grid present"
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      float v = id(grid_voltage_sensor).state;
      if (!isnan(v) && v > 150.0f) return 1.0f;
      float s = id(machine_state_sensor).state;
      // Raw 2 = mains bypass (validated NFE) / mains operation (generic),
      // 4 = AC power operation, 6 = inverter-to-AC, 7 = AC-to-inverter.
      if (s == 2.0f || s == 4.0f || s == 6.0f || s == 7.0f) return 1.0f;
      if (!isnan(v)) return 0.0f;
      return NAN;

  - platform: template
    id: bi_charger_state
    internal: true
    name: "BI Charger state"
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      float i = id(battery_current).state;
      float soc = id(battery_state_of_charge).state;
      float stop = id(batt_stop_chg).state;
      if (isnan(i) || isnan(soc)) return NAN;
      if (!isnan(stop) && soc >= stop - 2.0f && i < 2.0f) return 2.0f;
      return i > 0.5f ? 1.0f : 0.0f;
