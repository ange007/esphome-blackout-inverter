  - platform: template
    id: battery_power
    name: "Battery power"
    # Derived V x I (+charging). No direct battery-power register.
    disabled_by_default: true
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      float v = id(battery_voltage_sensor).state;
      float i = id(battery_current).state;
      if (isnan(v) || isnan(i)) return NAN;
      return v * i;

  - platform: template
    id: inverter_power_sensor
    name: "Inverter power"
    # Derived inverter V x inverter I. No direct inverter-power register;
    # falls to 0 in bypass (the direct load floor covers that case).
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      float v = id(inverter_voltage_sensor).state;
      float i = id(inverter_current_sensor).state;
      if (isnan(v) || isnan(i)) return NAN;
      return v * i;

  - platform: template
    id: grid_power_sensor
    name: "Grid power"
    # NEGATIVE while importing (core convention), POSITIVE while exporting.
    # No direct grid-power register: derived from mains charge current
    # (grid->battery leg) x grid voltage. House feed without mains charging
    # therefore reads ~0 — load rests on the direct floor.
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    update_interval: 60s
    accuracy_decimals: 0
    lambda: |-
      float v = id(grid_voltage_sensor).state;
      float i = id(mains_charge_current).state;
      if (isnan(v) || isnan(i)) return NAN;
      return -(v * i);

  # Contract readings (bi_*). Fixed ids for the core; each mirrors one SRNE
