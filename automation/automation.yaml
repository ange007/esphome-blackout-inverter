alias: Battery Smart Management
description: >-
  22:00 decide how much extra charge tomorrow's forecast justifies and notify,
  07:05 clear it, relay ESPHome notifications.

  The ESP defends the reserve on its own. This automation only decides how much EXTRA
  to add on top of it when tomorrow looks bad, and it no longer enables or disables the
  night charge automation: the reserve has to be held every night, including between
  23:00 and 00:00, which the old "turn on at midnight" version never covered.

  Both the decision and the notification happen at 22:00 in one pass. They used to be
  split 22:00 / 00:00, which quietly applied the wrong day: by 00:00
  `energy_production_tomorrow` has rolled over, so the charge running that very night
  was sized against the sun of the day AFTER the one it had to survive. 22:00 is still
  an hour ahead of the 23:00 window, and the profile only sets the target of a charge,
  never triggers one, so nothing starts earlier because of this.
triggers:
  - at: "22:00:00"
    id: apply_2200
    trigger: time
  - at: "07:05:00"
    id: reset_0705
    trigger: time
  # After a restart in the 22:00-06:30 window the bump would otherwise stay as it was
  # (or be lost with the ESP), so recompute it. No forecast learning here.
  - trigger: homeassistant
    event: start
    id: startup
  - event_type: esphome.battery_notification
    id: esp_notification
    trigger: event
conditions: []
actions:
  - choose:
      - alias: 22:00 apply profile and notify
        conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: apply_2200
              # Restart inside the night window: bump only, no learning (see below).
              - condition: and
                conditions:
                  - condition: trigger
                    id: startup
                  # Ends at 06:30, not 07:05: a write re-stamps the ESP's 12 h TTL, and one
                  # just before the 07:05 clear would carry the bump into the day.
                  - condition: time
                    after: "22:00:00"
                    before: "06:30:00"
        sequence:
          # The calibration and the stored forecast run only on the 22:00 trigger itself;
          # a startup run just recomputes the bump below.
          # Scoped to this branch on purpose. As a top-level block these templates ran on
          # every trigger, including each ESPHome notification — and one unavailable
          # sensor would abort the run before it reached the relay branch below, silently
          # swallowing the device's alerts.
          #
          # ── Forecast calibration ───────────────────────────────────────────────
          # Forecast integrations are biased per site (on the hours checked in Oct,
          # Open-Meteo's summed planes needed ~0.9). Learn the ratio instead of
          # hard-coding it: today's harvest against the raw forecast stored for today
          # at 22:00 last night, blended 20% per day so one odd day cannot swing it. Runs before tonight's forecast is
          # stored, which is why it lives here rather than in its own automation.
          - if:
              - condition: trigger
                id: apply_2200
            then:
              - variables:
                  pv_actual_today: >-
                    {{ states('sensor.blackout_inverter_eh_daily_solar_energy') | float(-1) }}
                  pv_made_for_today: "{{ states('input_number.pv_forecast_made') | float(0) }}"
                  # A brand-new input_number starts at its minimum (0.3, the helper's `min`);
                  # treat exactly that value as unset. A real factor sitting on the floor is
                  # indistinguishable, which is acceptable: it re-learns from 0.9 in a few days.
                  pv_factor_old: >-
                    {% set f = states('input_number.pv_forecast_factor') | float(0) %}
                    {{ f if f > 0.3 else 0.9 }}
                  # The date the stored forecast was made for; anything but today means the
                  # 22:00 run was missed and the stored value belongs to another day.
                  pv_made_date_ok: >-
                    {{ states('input_text.pv_forecast_made_date') == now().date() | string }}
                  # With the pack full the panels are throttled, so the harvest says nothing
                  # about the forecast — skip those days rather than learn "less sun".
                  pv_capped: >-
                    {{ states('sensor.battery_soc_max_today') | float(0) >= 97 }}
              - if:
                  - condition: template
                    value_template: >-
                      {{ pv_made_for_today >= 1 and pv_made_date_ok and not pv_capped
                         and pv_actual_today >= 0.15 * pv_made_for_today }}
                then:
                  - action: input_number.set_value
                    target:
                      entity_id: input_number.pv_forecast_factor
                    data:
                      value: >-
                        {% set ratio = [[pv_actual_today / pv_made_for_today, 0.3] | max, 1.3] | min %}
                        {{ (pv_factor_old * 0.8 + ratio * 0.2) | round(3) }}
              # The 0.15 floor above: an ESP that lost its energy integration through reboots
              # reads far too low, and that would drag the factor down for nothing.
              - action: input_number.set_value
                target:
                  entity_id: input_number.pv_forecast_made
                data:
                  value: "{{ states('sensor.pv_tomorrow_raw') | float(0) }}"
              - action: input_text.set_value
                target:
                  entity_id: input_text.pv_forecast_made_date
                data:
                  value: "{{ (now() + timedelta(days=1)).date() | string }}"
          - variables:
              # ── USER CONFIGURABLE ──────────────────────────────────────────────
              # Must match reserve_night_margin in the ESPHome substitutions.
              night_margin_soc: 5
              # Must match inverter_efficiency / inverter_idle_w in the ESPHome
              # substitutions — measured on this unit, see the comments there.
              inverter_efficiency: 0.87
              inverter_idle_w: 27
              # Day-tariff window the bump has to carry the house through.
              day_hours: 16
              # Used only until the device has learned an hourly load profile.
              expected_load_fallback_kwh: 4
              # ───────────────────────────────────────────────────────────────────
              # Pack size comes from the device rather than a second copy here; the two
              # would drift apart the first time either was edited alone.
              battery_capacity_kwh: >-
                {{ (states('number.blackout_inverter_battery_capacity') | float(190))
                   * 51.2 / 1000 }}
              # Daily consumption as measured, not as typed in. A hand-entered constant
              # goes stale as the seasons turn, and this figure decides whether
              # tomorrow's sun is judged sufficient. Unlearned hours of the profile fall
              # back to the running average, so it is usable from day one and sharpens
              # over about five.
              expected_load_kwh: >-
                {{ states('sensor.blackout_inverter_eh_expected_daily_load')
                   | float(expected_load_fallback_kwh) }}
              current_soc: >-
                {{ states('sensor.blackout_inverter_battery_state_of_charge') | float(0) }}
              # What an outage starting this minute would need. Reported, not targeted.
              reserve_now_soc: >-
                {{ states('sensor.blackout_inverter_eh_reserve_target_soc') | float(50) }}
              # What night charging actually aims at: the worst N-hour window of the
              # coming day. At midnight the "now" reserve is small — charging to that
              # would leave the evening peak to be bought at the day rate.
              reserve_peak_soc: >-
                {{ states('sensor.blackout_inverter_eh_reserve_peak_soc')
                   | float(reserve_now_soc) }}
              night_target_soc: "{{ [reserve_peak_soc + night_margin_soc, 90] | min }}"
              # Calibrated, both roof planes, lower of the two integrations — all done
              # in automation/helpers.yaml.
              # After midnight (a startup run before 07:05) "tomorrow" in the forecast
              # integrations is already the day after; the day being charged for is today,
              # whose sun is still all ahead: the calibrated remaining-today figure.
              tomorrow_total: >-
                {{ (states('sensor.pv_remaining_today_total') if now().hour < 12
                    else states('sensor.pv_tomorrow_total')) | float(0) }}
              # Load over the day-tariff window only: the night hours are paid at the
              # night rate however they are served. Falls back to 70% of the daily
              # figure (the measured share) until the ESP exposes the window itself.
              expected_day_load_kwh: >-
                {{ states('sensor.blackout_inverter_eh_expected_day_load')
                   | float(expected_load_kwh * 0.7) }}
              # Grid energy needed tonight to reach the night target from here.
              required_to_target_kwh: >-
                {{ max(0, ((night_target_soc - current_soc) / 100.0)
                          * battery_capacity_kwh) }}
              # The battery and the panels are both DC; the load is measured on the AC
              # side. Gross it up through the inverter and add its own standing draw,
              # or the shortfall comes out ~20% light.
              day_need_dc_kwh: >-
                {{ expected_day_load_kwh / inverter_efficiency
                   + inverter_idle_w * day_hours / 1000 }}
              net_solar_tomorrow_kwh: "{{ tomorrow_total - day_need_dc_kwh }}"
              # The point of the bump is to buy tonight, at the night rate, exactly what
              # tomorrow's sun will not cover. So size it by the shortfall itself.
              shortfall_kwh: "{{ max(0, day_need_dc_kwh - tomorrow_total) }}"
              shortfall_pct: >-
                {{ (shortfall_kwh / [battery_capacity_kwh, 0.1] | max * 100) | round(1) }}
              # Sent to the device as-is. It used to be squeezed into a four-step select
              # (0/5/10/20%), which threw this figure away and capped at 20% — a winter
              # shortfall is nearer 70% of the pack, so the ladder under-bought precisely
              # on the days that needed it. The device caps the resulting target at 90%,
              # so nothing beyond the number's own 0..40 range needs clamping here.
              night_bump_pct: "{{ [shortfall_pct, 40] | min | round(0) }}"
              # Kept only to word the notification below.
              profile_tomorrow: >-
                {% if shortfall_pct >= 18 -%}max
                {%- elif shortfall_pct >= 9 -%}balanced
                {%- elif shortfall_pct >= 4 -%}eco
                {%- else -%}off{%- endif %}
          # No forecast means shortfall = the whole day's need, i.e. the 40% maximum. That is
          # the safe side, so keep it, but say so.
          - if:
              - condition: template
                # The sensor this run actually used (see tomorrow_total).
                value_template: >-
                  {{ not has_value('sensor.pv_remaining_today_total' if now().hour < 12
                                   else 'sensor.pv_tomorrow_total') }}
            then:
              - action: persistent_notification.create
                data:
                  title: Night bump forecast missing
                  notification_id: battery_bump_forecast_missing
                  message: >-
                    {{ 'sensor.pv_remaining_today_total' if now().hour < 12 else 'sensor.pv_tomorrow_total' }}
                    was unavailable ({{ trigger.id }} run), so
                    the night bump was sized without sun: +{{ night_bump_pct }}%.
          - action: number.set_value
            target:
              entity_id: number.blackout_inverter_night_charge_bump
            data:
              value: "{{ night_bump_pct }}"
          - action: system_log.write
            data:
              level: info
              message: >
                NIGHT BUMP +{{ night_bump_pct }}%: SOC={{ current_soc | round(1) }}%,
                ReserveNow={{ reserve_now_soc | round(0) }}%,
                ReservePeak={{ reserve_peak_soc | round(0) }}%,
                NightTarget={{ night_target_soc | round(0) }}%,
                Pack={{ battery_capacity_kwh | round(2) }} kWh,
                TomorrowGen={{ tomorrow_total | round(2) }} kWh
                (raw {{ states('sensor.pv_tomorrow_raw') }} x factor
                {{ states('input_number.pv_forecast_factor') }}),
                DayLoad={{ expected_day_load_kwh | round(2) }} kWh AC
                = {{ day_need_dc_kwh | round(2) }} kWh DC,
                Net={{ net_solar_tomorrow_kwh | round(2) }} kWh,
                Shortfall={{ shortfall_kwh | round(2) }} kWh = {{ shortfall_pct }}%,
                Required={{ required_to_target_kwh | round(2) }} kWh
          - if:
              - condition: trigger
                id: apply_2200
            then:
              - action: notify.notify
                data:
                  # Worded around the shortfall, because that is what the step now means.
                  # "max" no longer implies zero generation, only that a fifth of the pack
                  # or more has to be bought tonight.
                  title: |
                    {% if profile_tomorrow == 'off' %}
                      ☀️ Tomorrow covers itself
                    {% else %}
                      {% if profile_tomorrow == 'max' %}🌙{% elif profile_tomorrow == 'balanced' %}⛅{% else %}🌥️{% endif %}
                      Tomorrow short {{ shortfall_kwh | round(1) }} kWh
                    {% endif %}
                  message: >
                    SOC: {{ current_soc | round(1) }}%.
                    Reserve now {{ reserve_now_soc | round(0) }}%,
                    peak {{ reserve_peak_soc | round(0) }}%,
                    night target {{ night_target_soc | round(0) }}%.
                    Tomorrow generation: {{ tomorrow_total | round(2) }} kWh
                    (forecast {{ states('sensor.pv_tomorrow_raw') }} ×
                    {{ states('input_number.pv_forecast_factor') }}).
                    Day load: {{ expected_day_load_kwh | round(2) }} kWh
                    ({{ day_need_dc_kwh | round(2) }} kWh from battery/PV).
                    Net solar: {{ net_solar_tomorrow_kwh | round(2) }} kWh.
                    Shortfall: {{ shortfall_kwh | round(2) }} kWh ({{ shortfall_pct }}% of pack).
                    Night bump: +{{ night_bump_pct }}%.
                  data:
                    tag: battery_forecast_2200
      - alias: 07:05 reset profile
        conditions:
          - condition: trigger
            id: reset_0705
        sequence:
          # Only the forecast bump is cleared. The night charge automation itself stays
          # on — the ESP needs it around the clock to defend the reserve.
          - action: number.set_value
            target:
              entity_id: number.blackout_inverter_night_charge_bump
            data:
              value: 0
          - action: system_log.write
            data:
              level: info
              message: Night charge bump cleared at 07:05
      - alias: ESPHome Battery Notifications
        conditions:
          - condition: trigger
            id: esp_notification
        sequence:
          - action: notify.notify
            data:
              title: "{{ trigger.event.data.title }}"
              message: "{{ trigger.event.data.message }}"
              data:
                tag: battery_{{ trigger.event.data.event_id }}
                priority: "{{ trigger.event.data.priority | default('normal') }}"
mode: queued
max: 10
