# Home Assistant package: site-specific glue for the MUST inverter config.
#
# Include from configuration.yaml:
#
#   homeassistant:
#     packages:
#       charge_helpers: !include helpers.yaml
#
# The ESPHome config knows nothing about your particular sensors — it has no forecast
# input at all. Combining forecast integrations, summing roof planes and calibrating the
# result all live on this side.
#
# Planes: one string per roof plane, the two strings in parallel on one MPPT, so their
# output adds. Checked hour by hour on 1-10 Oct, in hours the pack was not full: with
# one plane lit and the other not, the harvest followed the SUM (e.g. 1.52 kWh against
# 1.17-1.44 summed and 0.50-0.59 for "twice the weaker plane"). Different wiring — the
# planes in series in one string — would need the weaker plane instead.
#
# ONE plane: drop the `_2` / `panels_2` terms. THREE+: add more the same way.

template:
  - sensor:
      # Remaining PV generation for the rest of today.
      #
      # Informational: nothing consumes it automatically. Useful on a dashboard, and the
      # obvious input if you ever want an HA automation that pre-charges on a grey
      # afternoon — the way to ask for that is to raise
      # number.blackout_inverter_reserve_autonomy_target, which pushes SoC below the reserve
      # band and lets the device's own emergency path do the work.
      - name: PV Remaining Today Total
        unique_id: pv_remaining_today_total
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        state: >-
          {% set fs = (states('sensor.energy_production_today_remaining') | float(0))
                    + (states('sensor.energy_production_today_remaining_2') | float(0)) %}
          {% set om = (states('sensor.panels_1_energy_production_today_remaining') | float(0))
                    + (states('sensor.panels_2_energy_production_today_remaining') | float(0)) %}
          {% set fs_ok = has_value('sensor.energy_production_today_remaining') %}
          {% set om_ok = has_value('sensor.panels_1_energy_production_today_remaining') %}
          {% set raw = [fs, om] | min if fs_ok and om_ok else (fs if fs_ok else om) %}
          {{ (raw * (states('input_number.pv_forecast_factor') | float(0.9))) | round(2) }}
        availability: >-
          {{ has_value('sensor.energy_production_today_remaining')
             or has_value('sensor.panels_1_energy_production_today_remaining') }}

      # Tomorrow's forecast before calibration: each integration's planes summed, then
      # the LOWER of the two integrations. Both run optimistic here, and the lower one
      # was the closer of the two over 1-10 Oct. Falls back to whichever is available.
      - name: PV Tomorrow Raw
        unique_id: pv_tomorrow_raw
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        state: >-
          {% set fs = (states('sensor.energy_production_tomorrow') | float(0))
                    + (states('sensor.energy_production_tomorrow_2') | float(0)) %}
          {% set om = (states('sensor.panels_1_energy_production_tomorrow') | float(0))
                    + (states('sensor.panels_2_energy_production_tomorrow') | float(0)) %}
          {% set fs_ok = has_value('sensor.energy_production_tomorrow') %}
          {% set om_ok = has_value('sensor.panels_1_energy_production_tomorrow') %}
          {% if fs_ok and om_ok %}{{ [fs, om] | min | round(2) }}
          {% elif fs_ok %}{{ fs | round(2) }}
          {% else %}{{ om | round(2) }}{% endif %}
        availability: >-
          {{ has_value('sensor.energy_production_tomorrow')
             or has_value('sensor.panels_1_energy_production_tomorrow') }}

      # What tomorrow's panels will actually deliver: the raw forecast times the
      # self-learned correction factor below. Used by the Battery Smart Management
      # automation to size tonight's charge bump.
      - name: PV Tomorrow Total
        unique_id: pv_tomorrow_total
        unit_of_measurement: kWh
        device_class: energy
        state_class: measurement
        state: >-
          {{ ((states('sensor.pv_tomorrow_raw') | float(0))
              * (states('input_number.pv_forecast_factor') | float(0.8))) | round(2) }}
        availability: >-
          {{ has_value('sensor.pv_tomorrow_raw') }}

  # Outage charge plan (docs/design/outage-charge-plan.md):
  # the SoC needed for the current grid window, from the 5.2 calendar, the hourly PV
  # forecast and the hourly load (14 days of HA statistics; the ESP's own profile and then
  # its daily average as fallbacks). The automation "Outage Charge Plan" sends
  # it to number.blackout_inverter_outage_plan_soc.
  - trigger:
      - trigger: time_pattern
        minutes: /30
      - trigger: homeassistant
        event: start
      - trigger: state
        entity_id: binary_sensor.svitlo_region_queue_emergency_outages
      # Fire this event to recompute now (Developer tools → Events).
      - trigger: event
        event_type: outage_plan_refresh
    action:
      - action: calendar.get_events
        target:
          entity_id: calendar.svitlo_region_queue_outages_schedule
        data:
          duration:
            hours: 30
        response_variable: sched
        # A failed calendar call must not leave the last plan standing: `result` turns
        # empty below, the sensor goes unknown, the push stops, and the ESP drops the plan
        # 12 h later. (No PV forecast is not an error: it plans as if there were no sun.)
        continue_on_error: true
      # Hourly mean load for the last 14 days from HA's long-term statistics: kept forever,
      # so it survives the ESP losing its own learned profile (as a flash did on 3 Nov).
      - action: recorder.get_statistics
        data:
          statistic_ids:
            - sensor.blackout_inverter_eh_load_power
          start_time: "{{ (now() - timedelta(days=14)).isoformat() }}"
          period: hour
          types:
            - mean
        response_variable: stats
        continue_on_error: true
      - variables:
          result: >-
            {% from 'outage_plan.jinja' import outage_plan %}
            {% set cal = 'calendar.svitlo_region_queue_outages_schedule' %}
            {% if sched is not defined or sched[cal] is not defined %}{{ none }}{% else %}
            {% set factor = states('input_number.pv_forecast_factor') | float(0.9) %}
            {# The factor is learned against sensor.pv_tomorrow_raw, the LOWER of Forecast.Solar
               and Open-Meteo, but the hourly shape only exists for Open-Meteo. So scale each
               day's hourly values by min(1, FS day / OM day); missing or zero -> 1. #}
            {% set scale = {
              'today': (((states('sensor.energy_production_today') | float(0))
                         + (states('sensor.energy_production_today_2') | float(0)))
                        / ((states('sensor.panels_1_energy_production_today') | float(0))
                           + (states('sensor.panels_2_energy_production_today') | float(0)))
                       if has_value('sensor.energy_production_today')
                          and ((states('sensor.panels_1_energy_production_today') | float(0))
                               + (states('sensor.panels_2_energy_production_today') | float(0))) > 0
                       else 1),
              'tomorrow': (((states('sensor.energy_production_tomorrow') | float(0))
                            + (states('sensor.energy_production_tomorrow_2') | float(0)))
                           / ((states('sensor.panels_1_energy_production_tomorrow') | float(0))
                              + (states('sensor.panels_2_energy_production_tomorrow') | float(0)))
                          if has_value('sensor.energy_production_tomorrow')
                             and ((states('sensor.panels_1_energy_production_tomorrow') | float(0))
                                  + (states('sensor.panels_2_energy_production_tomorrow') | float(0))) > 0
                          else 1)} %}
            {% set p = namespace(d={}) %}
            {% for day in ['today', 'tomorrow'] %}
              {% set k_day = [scale[day], 1] | min %}
              {% for e in ['sensor.panels_1_energy_production_' ~ day, 'sensor.panels_2_energy_production_' ~ day] %}
                {% for k, v in (state_attr(e, 'wh_period') or {}).items() %}
                  {% set key = k[:13] %}
                  {% set p.d = dict(p.d, **{key: p.d.get(key, 0) + (v | float(0)) * factor * k_day}) %}
                {% endfor %}
              {% endfor %}
            {% endfor %}
            {% set avg = states('sensor.blackout_inverter_eh_daily_average_load') | float(400) %}
            {% set raw = states('sensor.blackout_inverter_eh_hourly_load_profile').split(',') %}
            {% set rows = (stats.statistics['sensor.blackout_inverter_eh_load_power'] | default([]))
                          if stats is defined and stats.statistics is defined else [] %}
            {% set acc = namespace(s=[0] * 24, n=[0] * 24) %}
            {% for r in rows if r.mean is not none %}
              {% set h = as_timestamp(r.start) | timestamp_custom('%H', true) | int %}
              {% set acc.s = acc.s[:h] + [acc.s[h] + r.mean] + acc.s[h + 1:] %}
              {% set acc.n = acc.n[:h] + [acc.n[h] + 1] + acc.n[h + 1:] %}
            {% endfor %}
            {% set load = namespace(l=[]) %}
            {% for h in range(24) %}
              {% set esp = (raw[h] if raw | count == 24 else 0) | float(0) %}
              {% set w = (acc.s[h] / acc.n[h]) if acc.n[h] >= 3 else (esp if esp > 0 else avg) %}
              {% set load.l = load.l + [w] %}
            {% endfor %}
            {{ outage_plan(as_timestamp(now()),
                           sched['calendar.svitlo_region_queue_outages_schedule'].events | default([]),
                           p.d, load.l,
                           states('number.blackout_inverter_battery_capacity') | float(190) * 51.2,
                           states('number.blackout_inverter_target_charge_current') | float(20),
                           is_state('binary_sensor.svitlo_region_queue_emergency_outages', 'on')) }}
            {% endif %}
    sensor:
      - name: Outage Charge Plan
        unique_id: outage_charge_plan
        unit_of_measurement: "%"
        icon: mdi:calendar-clock
        # `result` arrives as a string: the JSON (true/false/null, leading spaces) is not a
        # Python literal, so HA does not turn it into a dict on its own.
        state: >-
          {% set r = result if result is mapping else (result | string | trim | from_json(default={})) %}{{ r.plan if r.plan is defined else none }}
        attributes:
          need_now: >-
            {% set r = result if result is mapping else (result | string | trim | from_json(default={})) %}{{ r.need_now if r.need_now is defined else none }}
          need_at_outage: >-
            {% set r = result if result is mapping else (result | string | trim | from_json(default={})) %}{{ r.need_at_outage if r.need_at_outage is defined else none }}
          next_outage: >-
            {% set r = result if result is mapping else (result | string | trim | from_json(default={})) %}{{ (r.next_outage | timestamp_local) if r.next_outage else none }}
          day_grid: >-
            {% set r = result if result is mapping else (result | string | trim | from_json(default={})) %}{{ r.day_grid if r.day_grid is defined else none }}
          # Changes on every run, so last_updated shows when the plan was last computed
          # (the push automation refuses a plan older than 75 min).
          computed_at: "{{ now().isoformat() }}"
          feasible: >-
            {% set r = result if result is mapping else (result | string | trim | from_json(default={})) %}{{ r.feasible if r.feasible is defined else none }}

# Highest SoC over the last 12 h (read at 22:00 that is ~10:00-22:00, so last night's
# charge to 100% stays out of it), for the forecast calibration: a day that hit a full
# pack had its PV throttled, so its harvest is not a measure of the forecast. The name
# says "today" for history's sake. keep_last_sample holds the value across a quiet spell.
sensor:
  - platform: statistics
    name: Battery SoC Max Today
    unique_id: battery_soc_max_today
    entity_id: sensor.blackout_inverter_battery_state_of_charge
    state_characteristic: value_max
    max_age:
      hours: 12
    keep_last_sample: true
    sampling_size: 2000

# Calibration state for the forecast, kept by the Battery Smart Management automation
# at 22:00: it compares today's actual harvest with the raw forecast it stored for
# today last night, and nudges the factor 20% of the way toward that ratio.
#
# Only days the pack never filled count. A full pack throttles the panels, so that
# day's harvest measures the battery, not the sun — every day of 1-10 Oct hit 100%,
# and fitting those days suggested a 25-35% "plane mismatch" that the hour-by-hour data
# showed does not exist. The grey days that skip the cap are exactly the ones where the
# forecast decides how much to buy.
input_number:
  pv_forecast_factor:
    name: PV Forecast Factor
    icon: mdi:tune-variant
    min: 0.3
    max: 1.3
    step: 0.01
    mode: box
  # The raw forecast as it stood at 22:00 for the following day — what tomorrow's
  # learning step compares against.
  pv_forecast_made:
    name: PV Forecast Made
    icon: mdi:weather-partly-cloudy
    unit_of_measurement: kWh
    min: 0
    max: 50
    step: 0.01
    mode: box

# The date the stored forecast was made FOR (tomorrow's date, written at 22:00 together
# with pv_forecast_made). The learning step only runs when it equals today, so a missed
# 22:00 run cannot compare today's harvest with a forecast made for another day.
input_text:
  pv_forecast_made_date:
    name: PV Forecast Made For Date
    icon: mdi:calendar-check
    max: 10

  # The ESP's flash-restored settings as last seen while it ran steadily ("|"-joined),
  # kept by the automation "ESP Flash Guard" to spot a flash that lost them on a restart.
  esp_settings_snapshot:
    name: ESP Settings Snapshot
    icon: mdi:content-save-check
    max: 255
