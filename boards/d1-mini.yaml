# Board package for the Wemos D1 Mini (ESP8266). The RTC preference region used by
# blackout::RtcState is safe only while restore_from_flash is true — keep it.
#
# RS485 module pins (MAX485-style, with a DE/RE flow-control pin). Override in the device
# file if wired differently.
substitutions:
  tx_pin: GPIO13
  rx_pin: GPIO12
  flow_control_pin: GPIO14

esp8266:
  board: d1_mini
  restore_from_flash: true

preferences:
  flash_write_interval: 5min

logger:
  level: INFO
  logs:
    modbus_controller: WARN
    modbus: WARN

# Debug component (heap/loop metrics).
debug:
  update_interval: 60s

# Load the blackout component so its header is visible to lambdas. Config is empty.
blackout:

captive_portal:
  id: captive


web_server:
  id: web_srv
  port: 80
  log: false

