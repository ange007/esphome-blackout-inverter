# Growatt SPF (off-grid, Modbus RTU over RS485) on a Wemos D1 Mini.
# UNTESTED: the adapter never writes to the inverter until you set writes_enabled: "1" in adapters/growatt-spf.yaml, after checking every reading.
#
# Device file for the ESPHome dashboard, local form: this file sits in examples/ of a
# copy of the repository. In your own /config/esphome/ either keep that layout
# (/config/esphome/blackout/... and adjust the paths) or use the remote form,
# examples/must-pv18-remote.yaml. Any setting from core/defaults.yaml or
# boards/d1-mini.yaml can be overridden under `substitutions:` below.
esphome:
  name: ${device_name}

substitutions:
  device_name: growatt-inverter
  api_key: !secret api_key
  ota_password: !secret ota_password

packages:
  board: !include ../boards/d1-mini.yaml
  core: !include ../core/blackout.yaml
  adapter: !include ../adapters/growatt-spf.yaml

external_components:
  - source: ../components
    components: [blackout]

api:
  encryption:
    key: ${api_key}
  # Never reboot because Home Assistant is unreachable: the device keeps the battery under
  # control on its own (core/heal.yaml restarts it only for a wedged network stack).
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password
