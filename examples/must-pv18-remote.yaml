# MUST PV18 / PV19, remote form: the ESPHome dashboard fetches the core, the adapter and
# the board from GitHub at a pinned release; only this file lives in /config/esphome/.
# To update, change both refs to the new tag and read the release notes first (a release
# that changes the flash layout of restored settings says so).
esphome:
  name: ${device_name}

substitutions:
  device_name: blackout-inverter
  api_key: !secret api_key
  ota_password: !secret ota_password

packages:
  blackout:
    url: https://github.com/ange007/esphome-blackout-inverter
    ref: v1.0.0
    files:
      - boards/d1-mini.yaml
      - core/blackout.yaml
      - adapters/must-pv18.yaml

external_components:
  - source: github://ange007/esphome-blackout-inverter@v1.0.0
    components: [blackout]

api:
  encryption:
    key: ${api_key}
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: ${ota_password}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}
    password: !secret ap_password
